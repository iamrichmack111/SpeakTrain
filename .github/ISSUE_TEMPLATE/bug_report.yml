name: Bug report
description: Report a reproducible SpeakTrain problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach databases, recordings, passwords, or private learner data."
  - type: textarea
    id: summary
    attributes:
      {
        label: What happened?,
        description: Describe the observed and expected behavior.,
      }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      {
        label: Reproduction steps,
        placeholder: "1. Open…\n2. Choose…\n3. Observe…",
      }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: SpeakTrain version, placeholder: v0.6.0 }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      { label: Platform, options: [macOS, Linux, Windows, Docker, Other] }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sanitized logs, render: shell }
