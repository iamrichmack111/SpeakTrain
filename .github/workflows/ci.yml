name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - run: pytest -q

  playwright:
    name: Playwright browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-ci.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            docs/screenshots/*.png
            docs/demo/*.webm
          if-no-files-found: warn

  docs:
    name: README and demo validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - name: Verify committed README media
        run: |
          test -s docs/demo/speaktrain-playwright-demo.gif
          test -s docs/demo/speaktrain-playwright-demo.mp4
          test "$(find docs/screenshots -maxdepth 1 -name '*.png' | wc -l)" -ge 12
