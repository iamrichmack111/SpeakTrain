name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@v5
        if: always() && matrix.python-version == '3.12'
        with:
          name: pytest-results
          path: test-results/

  browser:
    name: Playwright browser and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-and-screenshots
          path: |
            playwright-report/
            test-results/
            docs/screenshots/*.png

  documentation:
    name: README, Wiki, and D2 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --
      - name: Render icon-based D2 diagrams
        run: |
          mkdir -p d2-rendered
          d2 docs/diagrams/architecture.d2 d2-rendered/architecture.svg
          d2 docs/diagrams/learning-flow.d2 d2-rendered/learning-flow.svg
          d2 docs/diagrams/ci-cd.d2 d2-rendered/ci-cd.svg
      - uses: actions/upload-artifact@v5
        with:
          name: d2-diagrams
          path: d2-rendered/

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: npm ci
      - run: npm audit --audit-level=high

  container:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: speaktrain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
