name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile source
        run: python -m compileall -q app.py speaktrain

      - name: Run tests
        run: pytest -q

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Verify README screenshots
        run: |
          test -d docs/screenshots
          COUNT="$(find docs/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)"
          echo "Playwright screenshots: $COUNT"
          test "$COUNT" -ge 12
