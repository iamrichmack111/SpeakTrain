name: Playwright Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: Screenshots and browser demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-ci.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run screenshots
      - run: npm run demo
      - name: Verify generated demo assets
        run: |
          test -s docs/demo/speaktrain-playwright-demo.webm
          test -s docs/demo/speaktrain-playwright-demo.gif
          test -s docs/demo/speaktrain-playwright-demo.mp4
          test "$(find docs/screenshots -maxdepth 1 -name '*.png' | wc -l)" -ge 12
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: speaktrain-playwright-demo
          path: |
            docs/screenshots/*.png
            docs/demo/*.webm
            docs/demo/*.gif
            docs/demo/*.mp4
            playwright-report/
            test-results/
          if-no-files-found: warn
