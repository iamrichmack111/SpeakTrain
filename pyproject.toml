[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speaktrain"
version = "0.6.0"
description = "Course-based Syrian Arabic and Spanish speaking, vocabulary, and OPI practice"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3"]

[tool.setuptools.package-data]
speaktrain = ["data/*.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
